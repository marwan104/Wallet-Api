services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/wallet
      DB_DRIVER: org.postgresql.Driver
      DB_USER: wallet
      DB_PASSWORD: wallet
      JWT_SECRET: change-me-to-a-long-random-secret-at-least-32-bytes-0123456789
    depends_on:
      db:
        condition: service_healthy

volumes:
  wallet_pgdata:
